[project]
name = "buildolaaiagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ashutoshvats03", email = "142529686+ashutoshvats03@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "pandas>=3.0.6",
    "psycopg2>=2.9.13",
    "pydantic>=2.13.5",
]

[project.scripts]
buildolaaiagent = "buildolaaiagent:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
